services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - seda_net

  mosquitto:
    image: eclipse-mosquitto:2
    environment:
      MQTT_ALLOW_ANONYMOUS: ${MQTT_ALLOW_ANONYMOUS:-true}
      MQTT_USERNAME: ${MQTT_USERNAME:-seda}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-seda}
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t seda/healthcheck -m ok"]
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 10s
    networks:
      - seda_net

  nodered:
    build:
      context: ./nodered
    ports:
      - "1880:1880"
    volumes:
      - ./nodered/data:/data
    depends_on:
      - mosquitto
      - postgres
    networks:
      - seda_net

  grafana:
    image: grafana/grafana-oss:latest
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - seda_net

  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - seda_net

  simulator:
    build:
      context: ./simulator
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
    depends_on:
      - mosquitto
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, socket; s=socket.create_connection((os.getenv('MQTT_HOST', 'mosquitto'), int(os.getenv('MQTT_PORT', '1883'))), 5); s.close()\""]
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 10s
    networks:
      - seda_net

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - node-exporter
      - mqtt-exporter
      - sql-exporter
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - seda_net

  node-exporter:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9100/metrics"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - seda_net

  # The broker's traffic, as a subscriber sees it: every message on seda/#
  # becomes a counter per topic, and every numeric field a gauge.
  mqtt-exporter:
    image: kpetrem/mqtt-exporter:1.12.1
    environment:
      MQTT_ADDRESS: mosquitto
      MQTT_TOPIC: "seda/#"
      PROMETHEUS_PORT: "9344"
    ports:
      - "9344:9344"
    depends_on:
      mosquitto:
        condition: service_healthy
    # It connects once at start-up and exits if the broker is not there yet.
    restart: unless-stopped
    networks:
      - seda_net

  sql-exporter:
    image: burningalchemist/sql_exporter:latest
    command:
      - "-config.file=/etc/sql_exporter/sql_exporter.yml"
      - "-config.data-source-name=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    ports:
      - "9399:9399"
    volumes:
      - ./prometheus/sql_exporter.yml:/etc/sql_exporter/sql_exporter.yml:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - seda_net

networks:
  seda_net:
    name: seda_net

volumes:
  postgres_data:
  grafana_data:

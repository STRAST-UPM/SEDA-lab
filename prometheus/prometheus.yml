global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  # Grafana publishes its own metrics page: nothing to install.
  - job_name: "grafana"
    static_configs:
      - targets: ["grafana:3000"]

  # PostgreSQL, from the inside: connections, table activity, data freshness.
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Node-RED's REST interface, from the outside: does it answer, and how fast?
  - job_name: "probe-http"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://nodered:1880/seda/status"]
    relabel_configs: &probe
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # The broker and the database, from the outside: do they accept connections?
  - job_name: "probe-tcp"
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ["mosquitto:1883", "postgres:5432"]
    relabel_configs: *probe

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  # Grafana publishes its own metrics page: nothing to install.
  - job_name: "grafana"
    static_configs:
      - targets: ["grafana:3000"]

  # The platform's data, from the inside: SQL queries in prometheus/sql_exporter.yml
  # (freshness of the newest measurement, rows inserted per table, connections).
  - job_name: "database"
    static_configs:
      - targets: ["sql-exporter:9399"]

  # Every container of the platform, from its cgroups (cAdvisor). Only seda-lab's
  # containers are kept, and the compose service becomes a short label: service.
  - job_name: "containers"
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      - source_labels: [container_label_com_docker_compose_project]
        regex: seda-lab
        action: keep
      - source_labels: [container_label_com_docker_compose_service]
        target_label: service
      - regex: container_label_com_docker_compose_(project|service)|id|image
        action: labeldrop

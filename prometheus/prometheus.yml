global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  # Grafana publishes its own metrics page: nothing to install.
  - job_name: "grafana"
    static_configs:
      - targets: ["grafana:3000"]

  # The platform's data, from the inside: SQL queries in prometheus/sql_exporter.yml
  # (freshness of the newest measurement, rows inserted per table, connections).
  - job_name: "database"
    static_configs:
      - targets: ["sql-exporter:9399"]

  # The broker's traffic, from a subscriber on seda/#: messages per topic
  # (mqtt_message_total) and the last numeric value per topic (mqtt_value).
  - job_name: "broker"
    static_configs:
      - targets: ["mqtt-exporter:9344"]

# Black-box probes: Prometheus asks the blackbox exporter to try a service from
# the outside, as a client would, and records whether it answered and how fast.
modules:
  http_2xx:          # an HTTP GET that must return 2xx (Node-RED's REST status endpoint)
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4
  tcp_connect:       # a TCP connection that must be accepted (broker, database)
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4

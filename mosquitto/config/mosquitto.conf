# SEDA-Lab Reference Platform 1.0
#
# Default teaching mode:
# - anonymous MQTT connections are enabled for local classroom use.
# - this matches MQTT_ALLOW_ANONYMOUS=true in .env.
#
# Authenticated mode, reserved for later hardening:
# - create a Mosquitto password file first, for example:
#     mosquitto_passwd -c /mosquitto/config/passwords <username>
# - then change the active line below to:
#     allow_anonymous false
# - and uncomment:
#     password_file /mosquitto/config/passwords
#
# Do not expose this broker directly to the Internet without TLS,
# authentication, authorization and proper secret management.

allow_anonymous true
# allow_anonymous false
# password_file /mosquitto/config/passwords

listener 1883
protocol mqtt

listener 9001
protocol websockets

persistence true
persistence_location /mosquitto/data/
